
<style>
  .logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 220px;
    background: #121214;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }
  .logo-stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 520px;
    height: 160px;
  }
  .mark-wrap {
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    opacity: 0;
    animation: markFade 0.6s ease 0.3s forwards;
  }
  @keyframes markFade { to { opacity: 1; } }

  .text-left {
    position: absolute;
    right: calc(50% + 64px);
    display: flex;
    align-items: center;
    overflow: hidden;
    opacity: 0;
    animation: textRevealLeft 0.9s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;
  }
  .text-right {
    position: absolute;
    left: calc(50% + 64px);
    display: flex;
    align-items: center;
    overflow: hidden;
    opacity: 0;
    animation: textRevealRight 0.9s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;
  }

  @keyframes textRevealLeft {
    0%  { opacity: 0; transform: translateX(60px); }
    100%{ opacity: 1; transform: translateX(0); }
  }
  @keyframes textRevealRight {
    0%  { opacity: 0; transform: translateX(-60px); }
    100%{ opacity: 1; transform: translateX(0); }
  }

  .word-turath {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 38px;
    font-weight: 400;
    color: #F4F1EA;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .word-ai {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 38px;
    font-weight: 400;
    color: #C5A059;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .arabic-sub {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Amiri', 'Traditional Arabic', serif;
    font-size: 15px;
    color: #C5A059;
    opacity: 0;
    letter-spacing: 2px;
    animation: subFade 0.8s ease 1.8s forwards;
    white-space: nowrap;
    direction: rtl;
  }
  @keyframes subFade { to { opacity: 0.7; } }

  .replay-btn {
    position: absolute;
    bottom: 12px;
    right: 16px;
    background: none;
    border: 1px solid #2A2825;
    color: #9C9488;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.05em;
  }
  .replay-btn:hover { border-color: #C5A059; color: #C5A059; }
</style>

<div class="logo-wrap" id="logoWrap">
  <div class="logo-stage" id="logoStage">

    <!-- Left: "Turath" pours out to the left -->
    <div class="text-left" id="textLeft">
      <span class="word-turath">Turath</span>
    </div>

    <!-- Center: Star mark -->
    <div class="mark-wrap" id="markWrap">
      <svg viewBox="0 0 130 130" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sg1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#E8C87A"/>
            <stop offset="50%" stop-color="#C5A059"/>
            <stop offset="100%" stop-color="#9A7535"/>
          </linearGradient>
        </defs>
        <g transform="translate(65,65)">
          <!-- Outer glow ring -->
          <circle r="58" fill="none" stroke="#C5A059" stroke-width="0.5"
                  stroke-dasharray="3 5" opacity="0.3"/>
          <!-- 8-pointed star -->
          <polygon points="0,-52 12,-12 52,0 12,12 0,52 -12,12 -52,0 -12,-12"
                   fill="url(#sg1)"/>
          <!-- Rotated inner square -->
          <polygon points="0,-37 37,0 0,37 -37,0"
                   fill="none" stroke="#C5A059" stroke-width="0.9" opacity="0.55"/>
          <!-- Central octagon — transparent -->
          <polygon points="0,-22 15,-15 22,0 15,15 0,22 -15,15 -22,0 -15,-15"
                   fill="transparent" stroke="url(#sg1)" stroke-width="1.2"/>
          <!-- Center dot -->
          <circle r="3.5" fill="#C5A059"/>
          <!-- 8 point diamonds -->
          <g fill="#E8C87A" opacity="0.9">
            <polygon points="0,-52 3,-46 0,-40 -3,-46"/>
            <polygon points="52,0 46,3 40,0 46,-3"/>
            <polygon points="0,52 3,46 0,40 -3,46"/>
            <polygon points="-52,0 -46,3 -40,0 -46,-3"/>
            <polygon points="36,-36 33,-28 28,-28 31,-33"/>
            <polygon points="36,36 31,33 28,28 33,31"/>
            <polygon points="-36,36 -33,31 -28,28 -31,33"/>
            <polygon points="-36,-36 -31,-33 -28,-28 -33,-31"/>
          </g>
        </g>
      </svg>
    </div>

    <!-- Right: "AI" pours out to the right -->
    <div class="text-right" id="textRight">
      <span class="word-ai">AI</span>
    </div>

    <!-- Arabic subtitle fades in last -->
    <div class="arabic-sub">تُرَاث</div>

  </div>
  <button class="replay-btn" onclick="replay()">replay</button>
</div>

<script>
function replay() {
  const els = ['markWrap','textLeft','textRight'];
  const stage = document.getElementById('logoStage');
  const sub = stage.querySelector('.arabic-sub');
  els.forEach(id => {
    const el = document.getElementById(id);
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = '';
  });
  sub.style.animation = 'none';
  sub.offsetHeight;
  sub.style.animation = '';
}
</script>
